projects:
  - id: "01"
    slug: floci-cloud-foundation
    name:
      en: Floci Cloud Foundation
      es: Fundamentos de nube con Floci
    description:
      en: Local Floci setup for the AWS CLI, Terraform, S3, DynamoDB, infrastructure lifecycle, state, and repeatable environments.
      es: Entorno local con Floci para la AWS CLI, Terraform, S3, DynamoDB, el ciclo de vida de la infraestructura, el estado y entornos repetibles.
    technologies:
      - Floci
      - Floci UI
      - Docker Compose
      - AWS CLI
      - Terraform
      - S3
      - DynamoDB
      - SQS
    difficulty: foundational
    status: implemented_learning_pending
    url: https://github.com/keviingarciah/floci-cloud-foundation
    url_verified: true
    documentation:
      - label:
          en: Architecture
          es: Arquitectura
        url: https://github.com/keviingarciah/floci-cloud-foundation/blob/main/docs/architecture.md
      - label:
          en: State notes
          es: Notas de estado
        url: https://github.com/keviingarciah/floci-cloud-foundation/blob/main/docs/state.md
      - label:
          en: Illustrated walkthrough
          es: Recorrido ilustrado
        url: https://keviingarciah.github.io/floci-cloud-foundation/
    demo: null
    featured: false
    repository_note:
      en: "The rebuilt public lab uses Floci 2.3.0, the Floci UI, Docker Compose, Terraform, and the AWS CLI to create an S3 bucket, a DynamoDB table, and an SQS queue on 127.0.0.1, with a guard that rejects other endpoints. An earlier private copy remains under the name floci-cloud-foundation-depr and is not linked. Learning reconstruction is still pending."
      es: "El laboratorio público rehecho usa Floci 2.3.0, la Floci UI, Docker Compose, Terraform y la AWS CLI para crear un bucket de S3, una tabla de DynamoDB y una cola de SQS en 127.0.0.1, con una validación que rechaza cualquier otro endpoint. Una copia privada anterior sigue bajo el nombre floci-cloud-foundation-depr y no se enlaza. La reconstrucción del aprendizaje sigue pendiente."

  - id: "02"
    slug: floci-event-driven-commerce
    name:
      en: Event-Driven Commerce
      es: Comercio orientado a eventos
    description:
      en: Go services on Floci for asynchronous orders, idempotency, retries, and dead-letter queues.
      es: Servicios en Go sobre Floci para pedidos asíncronos, idempotencia, reintentos y colas de mensajes fallidos.
    technologies:
      - Go
      - Lambda
      - API Gateway
      - DynamoDB
      - SQS
      - SNS
      - EventBridge
      - Step Functions
    difficulty: intermediate
    status: implemented_learning_pending
    url: null
    url_verified: false
    documentation: []
    demo: null
    featured: false
    repository_note:
      en: "A first version was finished, then made private and renamed to floci-event-driven-commerce-depr so the lab can be rebuilt from scratch. That retired Terraform included API Gateway, Lambda, DynamoDB, EventBridge, S3, SQS with a dead-letter queue, Step Functions, and IAM task roles. SNS was not in that Terraform. API Gateway authorization was described as optional follow-up. The portfolio repository is not published yet."
      es: "Una primera versión quedó terminada, luego se hizo privada y se renombró a floci-event-driven-commerce-depr para rehacer el laboratorio desde cero. Ese Terraform retirado incluía API Gateway, Lambda, DynamoDB, EventBridge, S3, SQS con cola de mensajes fallidos, Step Functions y roles de IAM para las tareas. SNS no estaba en ese Terraform. La autorización de API Gateway estaba descrita como seguimiento opcional. El repositorio del portafolio todavía no está publicado."

