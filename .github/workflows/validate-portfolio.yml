name: Validate portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate metadata, bilingual docs, and links
        run: python scripts/validate_portfolio.py --check-links
